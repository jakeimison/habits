<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1424">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Habits">
<title>Habits</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Palette rule: two complementary colours + one accent.
   --c1 (cool)  = structure & progress   --c2 (warm complement) = rewards, streaks, calls to action
   --acc        = completion only         base/surfaces/text are neutrals tinted toward --c1 */
:root{--bg:#0B1424;--s1:#121E33;--s2:#182842;--line:#22324F;--txt:#EEF2F8;--mut:#8A97AD;
  --c1:#4C7DFF;--c2:#FF8A3D;--acc:#3DDC97;--r:18px;--ease:cubic-bezier(.3,1.3,.5,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;color:var(--txt);font:16px/1.45 Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-weight:500;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"ss01" 1}
body{min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);overscroll-behavior-y:none;
  background:radial-gradient(90% 40% at 50% -5%,color-mix(in srgb,var(--c1) 16%,transparent),transparent 70%) no-repeat,var(--bg);transition:background .4s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:560px;margin:0 auto;padding:12px 18px calc(118px + env(safe-area-inset-bottom))}

/* HUD */
.hud{display:flex;align-items:center;gap:12px;margin:2px 0 22px}
.lvr{position:relative;width:46px;height:46px;flex:none}
.lvr svg{width:46px;height:46px;transform:rotate(-90deg)}
.lvr circle{fill:none;stroke-width:3.5}
.lvr .tr{stroke:var(--line)}.lvr .pr{stroke:var(--c1);stroke-linecap:round;transition:stroke-dashoffset .8s var(--ease)}
.lvr b{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:-.02em}
.lvi{flex:1;min-width:0}
.lvi .t{font-weight:700;font-size:15px;letter-spacing:-.01em}
.lvi .s{font-size:12px;color:var(--mut)}
.chips{display:flex;gap:6px}
.chip{display:flex;align-items:center;gap:5px;height:32px;padding:0 10px;border-radius:999px;background:var(--s1);border:1px solid var(--line);font-weight:700;font-size:14px}
.chip svg{font-size:15px}
#pStreak svg,#pXP svg{color:var(--c2)}#pFz svg{color:var(--c1)}
#pStreak.cold svg{color:var(--mut)}#pFz.none{opacity:.4}
.bump{animation:bump .5s var(--ease)}
@keyframes bump{40%{transform:scale(1.22)}}

.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:0 0 16px}
h1{font-size:30px;margin:0;font-weight:800;letter-spacing:-.035em;line-height:1.1}
.sub{color:var(--mut);font-size:14px;margin-top:3px}
.hbtn{display:flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:999px;background:var(--s1);border:1px solid var(--line);font-size:13px;font-weight:600}
.hbtn:active,.press:active{transform:scale(.96)}

.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card+.card{margin-top:10px}
.card h3{margin:0 0 14px;font-size:13px;font-weight:600;color:var(--mut);letter-spacing:.02em}
.sec{color:var(--mut);font-size:13px;font-weight:600;margin:26px 2px 10px;letter-spacing:.02em}

/* today hero */
.hero{display:flex;align-items:center;gap:18px;padding:18px}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{width:104px;height:104px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .tr{stroke:var(--s2)}
.ring .pr{stroke:var(--c1);stroke-linecap:round;transition:stroke-dashoffset .7s var(--ease),stroke .4s}
.ring.full .pr{stroke:var(--acc)}
.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ring b small{font-size:11px;font-weight:600;color:var(--mut);letter-spacing:0;margin-top:4px}
.hero .hi{flex:1;min-width:0}
.dnav{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.dnav b{font-size:17px;font-weight:700;letter-spacing:-.02em;flex:1}
.dnav button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--s2);font-size:15px;color:var(--mut)}
.dnav button:disabled{opacity:.3}
.nudge{font-size:13px;color:var(--mut);line-height:1.4}
.nudge em{font-style:normal;color:var(--c2);font-weight:600}
.nudge.done em{color:var(--acc)}
.xpday{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;font-weight:600;color:var(--c1);background:color-mix(in srgb,var(--c1) 12%,transparent);padding:4px 10px;border-radius:999px}

.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:13px;width:100%;padding:13px 14px;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);transition:transform .12s,background .3s,border-color .3s}
.row:active{transform:scale(.98)}
.row.done{background:color-mix(in srgb,var(--acc) 7%,var(--s1));border-color:color-mix(in srgb,var(--acc) 30%,var(--line))}
.emo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--s2);flex:none}
.info{flex:1;min-width:0}
.name{font-weight:600;font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .3s}
.done .name{opacity:.55}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--mut);margin-top:2px}
.meta .st{display:inline-flex;align-items:center;gap:4px;color:var(--c2);font-weight:600}
.meta .ok{color:var(--acc);font-weight:600}
.wkbar{height:4px;border-radius:2px;background:var(--s2);margin-top:8px;overflow:hidden;max-width:150px}
.wkbar i{display:block;height:100%;background:var(--c1);border-radius:2px;transition:width .5s var(--ease)}
.wkbar.hit i{background:var(--acc)}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:background .25s,border-color .25s}
.chk svg{width:16px;height:16px;fill:none;stroke:var(--bg);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chk path{stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .3s ease .05s}
.done .chk{background:var(--acc);border-color:var(--acc)}
.done .chk path{stroke-dashoffset:0}
.pop .chk{animation:chk .45s var(--ease)}
@keyframes chk{0%{transform:scale(.6)}55%{transform:scale(1.18)}100%{transform:scale(1)}}

/* reward + challenges teasers */
.rbox{display:flex;align-items:center;gap:14px;margin-top:22px;padding:14px 16px}
.rbox .gi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none;background:color-mix(in srgb,var(--c2) 14%,var(--s2));color:var(--c2)}
.rbox.locked .gi{background:var(--s2);color:var(--mut)}
.rbox.ready{border-color:color-mix(in srgb,var(--c2) 60%,var(--line));box-shadow:0 0 0 1px color-mix(in srgb,var(--c2) 35%,transparent),0 10px 30px -10px color-mix(in srgb,var(--c2) 50%,transparent)}
.rbox.ready .gi{animation:nudge 2.2s ease-in-out infinite}
@keyframes nudge{0%,72%,100%{transform:none}78%{transform:rotate(-10deg) scale(1.06)}86%{transform:rotate(8deg)}93%{transform:rotate(-3deg)}}
.rbox .t{font-weight:600;font-size:15px}
.rbox .d{font-size:13px;color:var(--mut)}
.pbar{height:4px;border-radius:2px;background:var(--s2);overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;background:var(--c2);border-radius:2px}
.teaser{display:flex;align-items:center;gap:12px;width:100%;margin-top:8px;padding:14px 16px;text-align:left}
.teaser .gi{color:var(--c1);font-size:20px}
.teaser .tx{flex:1;font-size:14px}
.teaser b{color:var(--c2);font-weight:600}
.teaser .ch{color:var(--mut)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;padding:0 18px;border-radius:14px;background:var(--c2);color:#1a0f05;font-weight:700;font-size:15px;letter-spacing:-.01em;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--s2);color:var(--txt);font-weight:600}
.btn.danger{background:#E5484D;color:#fff}
.btn.sm{width:auto;height:36px;padding:0 14px;font-size:13px;border-radius:999px}
.btn:disabled{opacity:.35;pointer-events:none}
.btn.glow{box-shadow:0 0 0 0 color-mix(in srgb,var(--c2) 60%,transparent);animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c2) 55%,transparent)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.banner{display:flex;align-items:center;gap:10px;border-radius:14px;padding:11px 14px;margin-bottom:10px;font-size:14px;font-weight:600;background:color-mix(in srgb,var(--c1) 14%,var(--s1));border:1px solid color-mix(in srgb,var(--c1) 35%,var(--line))}
.empty{text-align:center;padding:30px 20px}
.empty .ei{font-size:36px;color:var(--c1)}
.empty h3{margin:10px 0 4px;font-size:19px;font-weight:700;letter-spacing:-.02em}
.empty p{color:var(--mut);margin:0 0 18px;font-size:14px}
.chips2{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip2{background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:500}
.chip2:active{transform:scale(.96)}

/* challenges */
.qc{display:flex;gap:14px;padding:16px}
.qc+.qc{margin-top:8px}
.qc .gi{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;background:color-mix(in srgb,var(--c1) 14%,var(--s2));color:var(--c1)}
.qc.claimed .gi{background:color-mix(in srgb,var(--acc) 14%,var(--s2));color:var(--acc)}
.qc .qt{font-weight:600;font-size:15px}
.qc .qd{font-size:13px;color:var(--mut)}
.qc .qb{display:flex;align-items:center;gap:12px;margin-top:10px;min-height:36px}
.qc .qbar{flex:1;height:4px;border-radius:2px;background:var(--s2);overflow:hidden}
.qc .qbar i{display:block;height:100%;background:var(--c1);border-radius:2px;transition:width .5s}
.qc.claimed .qbar i{background:var(--acc)}
.qc .qn{font-size:12px;color:var(--mut);font-weight:600;min-width:28px;text-align:right}
.qc .rw{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--c2)}
.qc .cl{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--acc)}
.bonus{display:flex;align-items:center;gap:14px;margin-top:16px;padding:16px}
.bonus .gi{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;background:color-mix(in srgb,var(--c2) 14%,var(--s2));color:var(--c2)}
.segs{display:flex;gap:5px;margin-top:8px}
.segs b{flex:1;height:4px;border-radius:2px;background:var(--s2)}
.segs b.on{background:var(--c2)}

/* collection */
.pv{display:flex;align-items:center;gap:18px;padding:18px;margin-bottom:6px}
.sw3{display:flex}
.sw3 i{width:34px;height:34px;border-radius:50%;border:3px solid var(--s1);margin-left:-10px}
.sw3 i:first-child{margin-left:0}
.pv .t{font-weight:700;font-size:17px;letter-spacing:-.02em}
.pv .d{font-size:13px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.it{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;position:relative}
.it.eq{border-color:color-mix(in srgb,var(--c1) 70%,var(--line));box-shadow:0 0 0 1px color-mix(in srgb,var(--c1) 40%,transparent)}
.it .top{display:flex;align-items:center;justify-content:space-between;min-height:34px}
.it .nm{font-weight:600;font-size:14px;letter-spacing:-.01em}
.it .rr{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--mut)}
.it .rr i{width:7px;height:7px;border-radius:50%;background:var(--rc)}
.it .lk{font-size:12px;color:var(--mut);height:36px;display:flex;align-items:center;gap:6px}
.it.locked .top{opacity:.45}
.it .play{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--s2);color:var(--c1);font-size:14px}
.it .fxp{width:34px;height:34px;border-radius:10px;background:var(--s2);display:grid;place-items:center;color:var(--c2);font-size:16px}
.it .btn{height:36px;font-size:13px;border-radius:10px}
.note{font-size:12.5px;color:var(--mut);margin:10px 2px;line-height:1.5}

/* profile */
.pc{display:flex;align-items:center;gap:16px}
.pc .lvr{width:64px;height:64px}.pc .lvr svg{width:64px;height:64px}.pc .lvr b{font-size:20px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px 10px;text-align:center}
.kpi b{display:block;font-size:22px;font-weight:800;letter-spacing:-.03em}
.kpi span{font-size:12px;color:var(--mut)}
.wk{display:flex;align-items:flex-end;gap:8px;height:110px}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.wk i{display:block;width:100%;border-radius:6px;background:color-mix(in srgb,var(--c1) 70%,var(--s2));min-height:3px;transform-origin:bottom;animation:grow .6s var(--ease) backwards}
.wk i.today{background:var(--c2)}
.wk small{font-size:11px;color:var(--mut)}.wk em{font-style:normal;font-size:10px;color:var(--mut)}
@keyframes grow{from{transform:scaleY(0)}}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat b{aspect-ratio:1;border-radius:3px;background:var(--s2)}
.heat b.l1{background:color-mix(in srgb,var(--c1) 30%,var(--s2))}.heat b.l2{background:color-mix(in srgb,var(--c1) 60%,var(--s2))}.heat b.l3{background:var(--c1)}.heat b.l4{background:var(--acc)}
.heat b.f{background:transparent}.heat b.fz{background:color-mix(in srgb,var(--c1) 20%,transparent);outline:1px dashed var(--c1);outline-offset:-1px}
.heat b.t{outline:1.5px solid var(--txt);outline-offset:-1px}
.legend{display:flex;gap:4px;align-items:center;justify-content:flex-end;font-size:11px;color:var(--mut);margin-top:10px}
.legend b{width:10px;height:10px;border-radius:2px;display:inline-block}
.hs{display:flex;align-items:center;gap:12px}
.hs .emo{width:38px;height:38px;font-size:19px;border-radius:12px}
.hs .stats{display:flex;gap:14px;font-size:12.5px;color:var(--mut);margin-top:2px}
.hs .stats b{color:var(--txt);font-weight:600}
.bar{height:4px;background:var(--s2);border-radius:2px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c1);border-radius:2px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:34px}
.setrow+.setrow{margin-top:10px}
.sw{width:50px;height:30px;border-radius:15px;background:var(--s2);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.sw.on{background:var(--acc)}.sw.on::after{transform:translateX(20px)}
.pts{margin:0;padding:0;list-style:none;font-size:14px}
.pts li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.pts li:last-child{border:0}
.pts b{color:var(--txt);font-weight:600;text-align:right}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r)}
.mrow+.mrow{margin-top:8px}
.mrow .days{font-size:12.5px;color:var(--mut)}
.ib{width:34px;height:34px;border-radius:10px;background:var(--s2);display:grid;place-items:center;font-size:15px;color:var(--mut)}
.ib:disabled{opacity:.25}
.sync{font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--mut);display:inline-block}
.sync.ok i{background:var(--acc)}.sync.busy i{background:var(--c2)}.sync.off i{background:#E5484D}

/* tab bar: liquid glass */
nav{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;padding:0 20px;pointer-events:none;z-index:5}
.glass{pointer-events:auto;position:relative;display:flex;width:100%;max-width:420px;padding:6px;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02)),color-mix(in srgb,var(--bg) 55%,transparent);
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 1px rgba(255,255,255,.3),0 16px 40px rgba(0,0,0,.5);touch-action:none;-webkit-user-select:none;user-select:none}
.lens{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:999px;z-index:0;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));
  box-shadow:inset 0 1px 1px rgba(255,255,255,.45),0 4px 12px rgba(0,0,0,.25);transition:translate .55s cubic-bezier(.25,1.45,.45,1),width .35s ease,scale .3s var(--ease)}
.lens.drag{transition:width .35s ease,scale .3s var(--ease);scale:1.12 1.16;background:rgba(255,255,255,.08)}
.glass button{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-radius:999px;font-size:10px;font-weight:600;color:var(--mut);transition:color .3s}
.glass button svg{font-size:21px;transition:transform .45s var(--ease)}
.glass button.on{color:var(--txt)}.glass button.on svg{transform:scale(1.08)}
.glass button.hover svg{transform:scale(1.2)}
.glass button .bd{position:absolute;top:5px;right:calc(50% - 17px);width:8px;height:8px;border-radius:50%;background:var(--c2);box-shadow:0 0 0 2px var(--bg)}

/* sheets */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:10;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.ov.show{display:flex}
.sheet{background:var(--s1);width:100%;max-width:560px;border-radius:24px 24px 0 0;border-top:1px solid var(--line);padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .32s var(--ease)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.sheet h2{margin:0 0 16px;font-size:21px;font-weight:700;letter-spacing:-.02em}
label.f{display:block;font-size:13px;color:var(--mut);margin:16px 0 8px;font-weight:600}
input[type=text],textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px;color:var(--txt);font:inherit;font-size:16px}
input[type=text]:focus{outline:none;border-color:var(--c1)}
textarea{min-height:120px;font-size:12px;font-family:ui-monospace,monospace}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.grid button{aspect-ratio:1;border-radius:10px;background:var(--bg);font-size:20px;border:1.5px solid transparent}
.grid button.on{border-color:var(--c1);background:color-mix(in srgb,var(--c1) 15%,var(--bg))}
.cols{display:none}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);padding:4px;border-radius:12px}
.seg button{height:38px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--s2);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.dsel{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dsel button{height:40px;border-radius:10px;background:var(--bg);font-weight:600;font-size:14px;color:var(--mut)}
.dsel button.on{background:var(--c1);color:#fff}
.quick{display:flex;gap:6px;margin-top:10px}
.quick button{font-size:12.5px;color:var(--mut);background:var(--bg);padding:6px 11px;border-radius:999px}
.stepper{display:flex;align-items:center;justify-content:center;gap:24px;margin-top:16px}
.stepper button{width:46px;height:46px;border-radius:50%;background:var(--bg);font-size:24px;font-weight:500}
.stepper button:disabled{opacity:.3}
.stepper div{text-align:center;min-width:100px}
.stepper b{display:block;font-size:44px;font-weight:800;letter-spacing:-.04em;color:var(--txt);line-height:1}
.stepper span{font-size:13px;color:var(--mut)}
.acts{display:flex;gap:8px;margin-top:22px}
.steps{margin:14px 0;padding-left:22px;font-size:15px;line-height:1.55}.steps li{margin-bottom:8px}
.kbd{display:inline-block;background:var(--bg);border-radius:6px;padding:0 6px;font-size:13px}
.instbar{display:flex;align-items:center;gap:10px;width:100%;padding:13px 16px;margin-bottom:12px;text-align:left;font-size:14px;border-color:color-mix(in srgb,var(--c1) 50%,var(--line))!important}
.instbar span{flex:1}.instbar b{color:var(--c1)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--s2);border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{opacity:1}

/* effects */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
#fx .cf{position:absolute;display:block}
#fx .fxp{position:absolute;font-weight:800;font-size:16px;letter-spacing:-.01em;color:var(--c1);white-space:nowrap}
#fx .fxp.gold{color:var(--c2)}
#fx .fxp.neg{color:var(--mut);font-size:14px}
#fx .dot{position:absolute;left:0;top:0;width:9px;height:9px;border-radius:50%;background:var(--c2);box-shadow:0 0 12px var(--c2)}
#aur{position:fixed;inset:0;pointer-events:none;z-index:49;opacity:0;background:conic-gradient(from 180deg at 50% 60%,var(--c1),var(--acc),var(--c2),var(--c1));filter:blur(60px)}

/* celebration */
.cel{position:fixed;inset:0;z-index:45;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px 28px calc(24px + env(safe-area-inset-bottom));text-align:center;overflow:hidden}
.cel.show{display:flex}
.cel .glow{position:absolute;width:520px;height:520px;left:50%;top:40%;margin:-260px 0 0 -260px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--k) 30%,transparent),transparent 65%);animation:breathe 3s ease-in-out infinite,fadein .6s}
@keyframes breathe{50%{transform:scale(1.12);opacity:.8}}
@keyframes fadein{from{opacity:0}}
.cel .badge{position:relative;width:112px;height:112px;border-radius:50%;display:grid;place-items:center;font-size:48px;color:var(--k);background:var(--s1);border:1.5px solid color-mix(in srgb,var(--k) 55%,var(--line));box-shadow:0 0 0 10px color-mix(in srgb,var(--k) 8%,transparent),0 0 0 22px color-mix(in srgb,var(--k) 4%,transparent);animation:bounceIn .8s var(--ease) backwards;margin-top:-8vh}
@keyframes bounceIn{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.cel .big{position:relative;font-size:56px;font-weight:800;letter-spacing:-.05em;line-height:1;margin-top:26px;color:var(--k);animation:rise .6s var(--ease) .2s backwards}
.cel h2{position:relative;font-size:28px;font-weight:800;letter-spacing:-.035em;margin:20px 0 6px;animation:rise .5s var(--ease) .3s backwards}
.cel .big+h2{margin-top:8px}
.cel p{position:relative;color:var(--mut);font-size:15px;margin:0;max-width:300px;animation:rise .5s var(--ease) .4s backwards}
.cel .xpgain{position:relative;display:inline-flex;gap:6px;align-items:center;color:var(--c1);background:color-mix(in srgb,var(--c1) 12%,transparent);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;margin-top:18px;animation:rise .5s var(--ease) .55s backwards}
.cel .go{position:absolute;left:24px;right:24px;bottom:calc(24px + env(safe-area-inset-bottom));max-width:512px;margin:0 auto;animation:rise .5s ease .75s backwards}
@keyframes rise{from{transform:translateY(18px);opacity:0}}

/* perfect-day animation */
#pd{position:fixed;inset:0;z-index:46;display:flex;flex-direction:column;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 96%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);animation:fadein .3s;touch-action:none}
#pd.out{opacity:0;transition:opacity .3s}
#pd .pr{position:relative;width:260px;height:260px;margin-top:-6vh}
#pd svg{width:260px;height:260px;overflow:visible}
#pd .seg{fill:none;stroke-width:14;stroke-linecap:round;transition:stroke .3s}
#pd .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#pd .ctr b{font-size:54px;font-weight:800;letter-spacing:-.05em;line-height:1;transition:transform .4s var(--ease)}
#pd .ctr span{font-size:13px;color:var(--mut);font-weight:600;margin-top:6px;letter-spacing:.04em;text-transform:uppercase}
#pd .lbl{font-size:28px;font-weight:800;letter-spacing:-.035em;margin-top:34px;opacity:0;transform:translateY(12px);transition:all .5s var(--ease)}
#pd .lbl.on{opacity:1;transform:none}
#pd .lbl2{font-size:15px;color:var(--mut);margin-top:6px;opacity:0;transition:opacity .5s .15s}
#pd .lbl2.on{opacity:1}
#pd .skip{position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom));text-align:center;font-size:12.5px;color:var(--mut)}
.hud.lift{position:relative;z-index:47}

/* reward box */
#rb{position:fixed;inset:0;z-index:46;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);animation:fadein .25s;touch-action:none;text-align:center;overflow:hidden}
#rb .glow{position:absolute;width:520px;height:520px;left:50%;top:42%;margin:-260px 0 0 -260px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--tc) 32%,transparent),transparent 62%);opacity:.25;transition:opacity .4s,transform .6s var(--ease)}
#rb.t1 .glow{opacity:.45}#rb.t2 .glow{opacity:.75;transform:scale(1.1)}#rb.open .glow{opacity:1;transform:scale(1.3)}
#rb .box{position:relative;width:150px;height:150px;margin-top:-8vh;transition:transform .5s var(--ease),opacity .4s}
#rb .box svg{width:100%;height:100%;overflow:visible}
#rb .box.s1{animation:shake1 .35s}#rb .box.s2{animation:shake2 .4s}
@keyframes shake1{25%{transform:rotate(-5deg) scale(1.04)}55%{transform:rotate(5deg)}85%{transform:rotate(-2deg)}}
@keyframes shake2{15%{transform:rotate(-9deg) scale(1.08)}35%{transform:rotate(9deg) scale(1.1)}55%{transform:rotate(-6deg)}75%{transform:rotate(4deg)}}
#rb #lid{transition:transform .55s var(--ease),opacity .45s;transform-box:fill-box;transform-origin:50% 100%}
#rb.open #lid{transform:translateY(-90px) rotate(-18deg);opacity:0}
#rb.open .box{transform:translateY(140px) scale(.6);opacity:.35}
#rb .ctxt{font-size:22px;font-weight:800;letter-spacing:-.03em;margin-top:26px}
#rb .hint{font-size:13.5px;color:var(--mut);margin-top:4px}
#rb .pips{display:flex;gap:6px;justify-content:center;margin-top:16px}
#rb .pips b{width:28px;height:4px;border-radius:2px;background:var(--s2);transition:background .2s}
#rb .pips b.on{background:var(--c2)}
#rb.open .ctxt,#rb.open .hint,#rb.open .pips{display:none}
#rb .reward{position:absolute;left:0;right:0;top:19%;display:none;flex-direction:column;align-items:center;padding:0 24px}
#rb.open .reward{display:flex}
#rb .reward .rt{font-size:12px;font-weight:800;letter-spacing:.24em;color:var(--tc);animation:rise .5s var(--ease) .1s backwards}
#rb .reward .ri{width:96px;height:96px;border-radius:28px;display:grid;place-items:center;font-size:44px;margin:16px 0;color:var(--tc);background:var(--s1);border:1.5px solid color-mix(in srgb,var(--tc) 55%,var(--line));animation:bounceIn .7s var(--ease) .15s backwards}
#rb .reward .ri .sw3 i{width:30px;height:30px}
#rb .reward .rn{font-size:30px;font-weight:800;letter-spacing:-.04em;animation:rise .5s var(--ease) .3s backwards}
#rb .reward .rs{color:var(--mut);font-size:14px;margin-top:4px;animation:rise .5s var(--ease) .4s backwards}
#rb .go{position:absolute;left:24px;right:24px;bottom:calc(24px + env(safe-area-inset-bottom));max-width:512px;margin:0 auto;display:none}
#rb.open .go{display:block;animation:rise .4s ease .7s backwards}
/* friends */
.fcode{display:flex;align-items:center;gap:12px}
.fcode .code{font:800 26px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.2em;color:var(--c2);margin-top:2px}
.addf{display:flex;gap:8px;margin-top:8px!important;padding:8px}
.addf input{flex:1;text-transform:uppercase;letter-spacing:.18em;font-weight:700;border:0;background:transparent;padding:8px}
.addf input::placeholder{letter-spacing:0;text-transform:none;font-weight:500}
.lb{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);transition:transform .12s}
.lrow:active{transform:scale(.98)}
.lrow.me{border-color:color-mix(in srgb,var(--c1) 60%,var(--line));background:color-mix(in srgb,var(--c1) 8%,var(--s1))}
.rk{width:22px;text-align:center;font-weight:800;color:var(--mut);flex:none}
.rk.r1{color:var(--c2)}.rk.r2{color:var(--c1)}.rk.r3{color:var(--acc)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:color-mix(in srgb,var(--c1) 28%,var(--s2));flex:none}
.lsub{font-size:12px;color:var(--mut)}
.val{font-weight:800;font-size:16px;letter-spacing:-.02em;white-space:nowrap}
.val small{font-size:11px;color:var(--mut);font-weight:600}
.crow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.cpick{width:44px;height:44px;border-radius:12px;flex:none;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.cpick input{position:absolute;inset:-8px;width:60px;height:60px;opacity:0;cursor:pointer;border:0;padding:0}
.hex{width:88px!important;padding:9px 8px!important;font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace!important;text-transform:uppercase;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

<script>
/* ================= constants & utils ================= */
const EMOJI=["💧","📚","🏃","🧘","💪","🥗","😴","📈","🎯","✍️","🧠","🚶","🎾","🍎","☀️","🧹","💊","🎸","🗣️","💻","📵","🙏","🚭","🦷"];

const DN=["M","T","W","T","F","S","S"],DNL=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const SUGG=[["💧","Drink 2L water"],["📚","Read 20 min"],["🏃","Exercise"],["🧘","Meditate 10 min"],["🧠","Study 1 hour"],["😴","Bed by 11pm"],["📵","No phone first hour"],["🚶","10k steps"]];
const LS="habit-tracker.v1";
const XP_BASE=10,XP_STREAK_STEP=2,XP_STREAK_CAP=10,XP_PERFECT=50,XP_WEEK=30;
const FREEZE_MAX=2,FREEZE_COST=150;
const MILESTONES=[3,7,14,30,50,100,200,365,500,1000];
const ICONS={"today": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M8 12.5l2.8 2.8L16 9.8\"/>", "flag": "<path d=\"M5 21V4\"/><path d=\"M5 4h12l-2.5 4L17 12H5\"/>", "gem": "<path d=\"M6 3h12l4 6-10 12L2 9z\"/><path d=\"M2 9h20\"/><path d=\"M12 21L8 9l4-6 4 6z\"/>", "user": "<circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6\"/>", "flame": "<path d=\"M12 3c.8 3.2 5 5.2 5 10.2a5 5 0 0 1-10 0c0-2.3 1.2-3.8 2.3-4.8.1 1.9 1 3 2 3.1-.3-3.4-.6-5.6.7-8.5z\"/>", "snow": "<path d=\"M12 2v20M3.5 7l17 10M20.5 7l-17 10\"/><path d=\"M9 3.5l3 2.5 3-2.5M9 20.5l3-2.5 3 2.5\"/>", "coin": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M14.8 9.2c-.4-1-1.5-1.7-2.8-1.7-1.6 0-2.8.9-2.8 2.1 0 2.9 5.8 1.6 5.8 4.6 0 1.2-1.3 2.2-3 2.2-1.4 0-2.6-.7-3-1.8M12 6v1.5M12 16.5V18\"/>", "gift": "<rect x=\"3\" y=\"9\" width=\"18\" height=\"12\" rx=\"2\"/><path d=\"M3 13h18M12 9v12\"/><path d=\"M12 9C10.5 5 6.5 5 6.5 7.2 6.5 9 10 9 12 9zm0 0c1.5-4 5.5-4 5.5-1.8C17.5 9 14 9 12 9z\"/>", "trophy": "<path d=\"M8 4h8v5a4 4 0 0 1-8 0z\"/><path d=\"M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.5 20h7\"/>", "star": "<path d=\"M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z\"/>", "calendar": "<rect x=\"3.5\" y=\"5\" width=\"17\" height=\"15.5\" rx=\"2.5\"/><path d=\"M3.5 10h17M8 3v4M16 3v4\"/>", "check": "<path d=\"M5 12.5l4.5 4.5L19 7.5\"/>", "layers": "<path d=\"M12 3l9 5-9 5-9-5z\"/><path d=\"M3 13l9 5 9-5\"/>", "sun": "<circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4\"/>", "sunrise": "<path d=\"M5 17a7 7 0 0 1 14 0\"/><path d=\"M2.5 20.5h19M12 3v5M9 6l3-3 3 3M4.5 11l1.5 1M19.5 11L18 12\"/>", "sunset": "<path d=\"M5 17a7 7 0 0 1 14 0\"/><path d=\"M2.5 20.5h19M12 8V3M9 5l3 3 3-3M4.5 11l1.5 1M19.5 11L18 12\"/>", "target": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><circle cx=\"12\" cy=\"12\" r=\"5\"/><circle cx=\"12\" cy=\"12\" r=\"1.2\"/>", "chev_l": "<path d=\"M15 5l-7 7 7 7\"/>", "chev_r": "<path d=\"M9 5l7 7-7 7\"/>", "edit": "<path d=\"M4 20h4L19 9l-4-4L4 16z\"/><path d=\"M13.5 6.5l4 4\"/>", "plus": "<path d=\"M12 5v14M5 12h14\"/>", "play": "<path d=\"M8 5.5v13l10.5-6.5z\"/>", "sparkle": "<path d=\"M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z\"/>", "lock": "<rect x=\"5\" y=\"11\" width=\"14\" height=\"10\" rx=\"2.5\"/><path d=\"M8 11V8a4 4 0 0 1 8 0v3\"/>", "palette": "<path d=\"M12 3a9 9 0 0 0 0 18c1.2 0 1.8-.8 1.8-1.7 0-1.4-1.2-1.6-1.2-2.8 0-1 .8-1.6 1.8-1.6H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z\"/><circle cx=\"7.5\" cy=\"11\" r=\"1.2\"/><circle cx=\"10\" cy=\"7\" r=\"1.2\"/><circle cx=\"15\" cy=\"7\" r=\"1.2\"/>", "music": "<path d=\"M9 18V5l11-2v13\"/><circle cx=\"6.5\" cy=\"18\" r=\"2.5\"/><circle cx=\"17.5\" cy=\"16\" r=\"2.5\"/>", "users": "<circle cx=\"9\" cy=\"8\" r=\"3.5\"/><path d=\"M2.5 20c1-3.6 3.6-5.6 6.5-5.6s5.5 2 6.5 5.6\"/><path d=\"M16 4.7a3.5 3.5 0 0 1 0 6.6M17.5 14.6c2 .7 3.3 2.5 3.9 5.4\"/>", "copy": "<rect x=\"8.5\" y=\"8.5\" width=\"12\" height=\"12\" rx=\"2.5\"/><path d=\"M15.5 8.5V5.5a2 2 0 0 0-2-2h-8a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3\"/>", "refresh": "<path d=\"M20 11.5A8 8 0 1 1 17.7 6\"/><path d=\"M20 4v5h-5\"/>", "wand": "<path d=\"M4 20L15 9M14 4v3M19 9h-3M17.5 5.5l-2 2M18 14v2M20 15h-2M8 3v2M9 4H7\"/>"};
const I=(n,cls="i")=>`<svg class="${cls}" viewBox="0 0 24 24">${ICONS[n]||""}</svg>`;
const RAR={common:{c:"var(--mut)",n:"Common"},rare:{c:"var(--c1)",n:"Rare"},epic:{c:"var(--acc)",n:"Epic"},legendary:{c:"var(--c2)",n:"Legendary"}};
// Every palette follows the same rule: two complementary colours (c1 cool, c2 warm) + one accent.

const weekStart=d=>addDays(d,-dow(d));
function normalize(){
  S.settings=Object.assign({sound:true},S.settings||{});S.log=S.log||{};S.frozen=S.frozen||{};
  if(S.freezes===undefined)S.freezes=1;S.spent=S.spent||0;S.gold=S.gold||0;S.pity=S.pity||0;
  S.owned=S.owned||{};S.equip=Object.assign({palette:"p_mid",sound:"s_chime",effect:"e_part"},S.equip||{});
  S.chests=S.chests||{};S.quests=S.quests||{};
  if((S.v||1)<4){S.spent=0;S.owned={};S.v=4}
  S.habits.forEach(h=>{if(!h.freq)h.freq="days";if(!h.target)h.target=3;if(!h.days||!h.days.length)h.days=[0,1,2,3,4,5,6]});
  const cutoff=key(addDays(today(),-14));
  for(const k in S.quests)if(k<cutoff)delete S.quests[k];
  for(const k in S.chests)if(k.slice(0,10)<cutoff&&S.chests[k].state!=="ready")delete S.chests[k];
}
function startOf(h){let s=h.created;for(const k in S.log)if(S.log[k][h.id]&&k<s)s=k;return parse(s)}
function toggle(h,k){
  S.log[k]=S.log[k]||{};
  if(S.log[k][h.id])delete S.log[k][h.id];else S.log[k][h.id]=k===key(today())?Date.now():1;
  if(!Object.keys(S.log[k]).length)delete S.log[k];
  if(S.frozen[k]&&anyDone(k)){delete S.frozen[k];S.freezes=Math.min(FREEZE_MAX,S.freezes+1)}
  commit();
}
function weekCount(h,d){const ws=weekStart(d);let c=0;for(let i=0;i<7;i++)if(isDone(h,key(addDays(ws,i))))c++;return c}
function streak(h){
  if(weekly(h)){const st=weekStart(startOf(h));let w=weekStart(today()),n=0;if(weekCount(h,w)<h.target)w=addDays(w,-7);while(w>=st&&weekCount(h,w)>=h.target){n++;w=addDays(w,-7)}return n}
  const st=startOf(h);let d=today(),n=0;
  if(!isDone(h,key(d)))d=addDays(d,-1);
  while(d>=st){const k=key(d);if(sched(h,d)&&!frozenMiss(h,k)){if(isDone(h,k))n++;else break}d=addDays(d,-1)}
  return n;
}
function best(h){
  const t=today();
  if(weekly(h)){const cw=weekStart(t);let w=weekStart(startOf(h)),run=0,b=0;while(w<=cw){if(weekCount(h,w)>=h.target){run++;b=Math.max(b,run)}else if(+w!==+cw)run=0;w=addDays(w,7)}return b}
  let d=startOf(h),run=0,b=0;
  while(d<=t){const k=key(d);if(sched(h,d)&&!frozenMiss(h,k)){if(isDone(h,k)){run++;b=Math.max(b,run)}else if(+d!==+t)run=0}d=addDays(d,1)}
  return b;
}
function rate(h,days){
  const t=today(),st=startOf(h);
  if(weekly(h)){const cw=weekStart(t);let s=0,c=0;if(weekCount(h,cw)>=h.target){s++;c++}
    for(let i=1;i<=4;i++){const w=addDays(cw,-7*i);if(addDays(w,6)<st)break;s++;if(weekCount(h,w)>=h.target)c++}
    return s?Math.round(c/s*100):null}
  let s=0,c=0;
  for(let i=0;i<days;i++){const d=addDays(t,-i);if(d<st)break;const k=key(d);if(!sched(h,d)||frozenMiss(h,k))continue;if(+d===+t&&!isDone(h,k))continue;s++;if(isDone(h,k))c++}
  return s?Math.round(c/s*100):null;
}
function isPerfect(k){const d=parse(k);const hs=S.habits.filter(h=>sched(h,d)&&d>=startOf(h));return hs.length>0&&hs.every(h=>isDone(h,k))}
function dayStreak(){const ok=k=>anyDone(k)||!!S.frozen[k];let d=today(),n=0;if(!anyDone(key(d)))d=addDays(d,-1);while(ok(key(d))){if(anyDone(key(d)))n++;d=addDays(d,-1)}return n}
function applyFreezes(){
  const y=addDays(today(),-1),yk=key(y);
  if(S.checked===yk)return false;
  if(!S.checked){S.checked=yk;return false}
  let d=addDays(parse(S.checked),1);const used=[];
  if(d<addDays(y,-60))d=addDays(y,-60);
  for(;d<=y;d=addDays(d,1)){const k=key(d);if(anyDone(k)||S.frozen[k])continue;const pk=key(addDays(d,-1));
    if((anyDone(pk)||S.frozen[pk])&&S.freezes>0){S.frozen[k]=1;S.freezes--;used.push(k)}}
  S.checked=yk;
  if(used.length)setTimeout(()=>celebrate({icon:"snow",k:"var(--c1)",title:used.length>1?`${used.length} streak freezes used`:"Streak freeze used",
    sub:`You missed ${used.length>1?used.length+" days":dayLabel(parse(used[0])).toLowerCase()}, but your 🔥 ${dayStreak()} day streak is safe. ${S.freezes} freeze${S.freezes===1?"":"s"} left.`,sound:"streak"}),300);
  return used.length>0;
}


/* ================= XP, levels, gold ================= */
function computeXP(){
  const hs=S.habits,out={total:0,byDay:{}};if(!hs.length)return out;
  const st=new Map(hs.map(h=>[h.id,startOf(h)]));
  let first=today();st.forEach(v=>{if(v<first)first=v});
  const t=today(),run={},wc={};
  for(let d=new Date(first);d<=t;d=addDays(d,1)){
    const k=key(d);let dx=0,sc=0,dn=0;
    if(dow(d)===0)for(const id in wc)wc[id]=0;
    for(const h of hs){
      if(d<st.get(h.id))continue;const done=isDone(h,k);
      if(weekly(h)){if(done){dx+=XP_BASE;wc[h.id]=(wc[h.id]||0)+1;if(wc[h.id]===h.target)dx+=XP_WEEK}continue}
      if(!sched(h,d)){if(done)dx+=XP_BASE;continue}
      if(S.frozen[k]&&!done)continue;
      sc++;
      if(done){run[h.id]=(run[h.id]||0)+1;dn++;dx+=XP_BASE+Math.min(run[h.id]-1,XP_STREAK_CAP)*XP_STREAK_STEP}
      else if(+d!==+t)run[h.id]=0;
    }
    if(sc&&dn===sc)dx+=XP_PERFECT;
    if(dx){out.byDay[k]=dx;out.total+=dx}
  }
  return out;
}

function lvl(xp){let L=1;while(xp>=lvlCum(L+1))L++;return{L,into:xp-lvlCum(L),need:lvlCum(L+1)-lvlCum(L)}}

function hex2hsl(hex){let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0,l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return[h,s*100,l*100]}
function hsl2hex(h,s,l){h=((h%360)+360)%360;s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return"#"+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,"0")).join("")}
const okHex=v=>/^#[0-9a-f]{6}$/i.test(v);
const complementOf=hex=>{const[h,s]=hex2hsl(hex);return hsl2hex(h+180,Math.max(70,s),60)};
const accentFor=hex=>{const[h]=hex2hsl(hex);return hsl2hex(h-90,62,55)};
const baseFor=hex=>{const[h]=hex2hsl(hex);return hsl2hex(h,45,9)};
function customV(c){c=c||S.custom;const[h,s,l]=hex2hsl(okHex(c.bg)?c.bg:"#0B1424"),L=Math.min(l,16),sat=Math.min(s,55);
  return{bg:hsl2hex(h,sat,L),s1:hsl2hex(h,sat*.9,L+5),s2:hsl2hex(h,sat*.85,L+9),line:hsl2hex(h,sat*.7,L+15),c1:c.c1,c2:c.c2,acc:c.acc}}
const palV=it=>it.custom?customV():it.v;

function seeded(str){let h=2166136261;for(const ch of str){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return((h>>>0)%100000)/100000}}
function qctx(){
  const t=today(),k=key(t),on=S.habits.filter(h=>sched(h,t)),wk=S.habits.filter(weekly),all=on.concat(wk),L=S.log[k]||{};
  const hrs=[];all.forEach(h=>{const v=L[h.id];if(v>1e12)hrs.push(new Date(v).getHours())});
  return{k,on,wk,all,hrs,doneN:all.filter(h=>L[h.id]).length,onDone:on.filter(h=>L[h.id]).length,
    before20:on.filter(h=>{const v=L[h.id];return v&&(v<1e12||new Date(v).getHours()<20)}).length,wkDone:wk.some(h=>L[h.id])};
}
function ensureQuests(){
  const k=key(today());if(S.quests[k]||!S.habits.length)return;
  const c=qctx(),rnd=seeded("q"+k),pool=Object.keys(QUESTS).filter(id=>id!=="visit"&&QUESTS[id].ok(c));
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  const pick=[];for(const id of pool){if(pick.length>=2)break;if((id==="bull"&&pick.includes("dusk"))||(id==="dusk"&&pick.includes("bull")))continue;pick.push(id)}
  S.quests[k]={ids:["visit",...pick],claimed:{},bonus:false};saveLocal();
}
function questState(){
  const k=key(today()),q=S.quests[k];if(!q)return null;const c=qctx();
  const list=q.ids.map(id=>{const Q=QUESTS[id],r=Q.ch(c);return{id,...Q,p:Math.min(r.p,r.g),g:r.g,done:r.g>0&&r.p>=r.g,claimed:!!q.claimed[id]}});
  return{k,q,list,claimable:list.filter(x=>x.done&&!x.claimed).length,claimedN:list.filter(x=>x.claimed).length};
}

function rollChest(){
  S.pity=(S.pity||0)+1;let r=Math.random(),tier="common",acc=0;
  for(const [t,p] of CHEST_ODDS){acc+=p;if(r<acc){tier=t;break}}
  if(S.pity>=5&&tier==="common")tier="rare";
  if(tier!=="common")S.pity=0;
  if(tier==="legendary"){const pool=ITEMS.filter(i=>i.chest&&!S.owned[i.id]);if(pool.length)return{tier,type:"item",id:pool[rint(0,pool.length-1)].id};return{tier,type:"gold",n:500}}
  if(tier==="epic"){if(S.freezes<FREEZE_MAX&&Math.random()<.6)return{tier,type:"freeze"};return{tier,type:"gold",n:rint(180,240)}}
  if(tier==="rare")return{tier,type:"gold",n:rint(60,120)};
  return{tier,type:"gold",n:rint(15,40)};
}

let AC=null;
function ac(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();return AC}
function tones(fs,{gap=.07,dur=.1,type="triangle",vol=.16,force}={}){
  if(!S.settings.sound&&!force)return;
  try{const a=ac(),t0=a.currentTime+.01;
    fs.forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain(),s=t0+i*gap;o.type=type;o.frequency.value=f;
      g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(vol,s+.01);g.gain.exponentialRampToValueAtTime(.0008,s+dur+.18);
      o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+dur+.22)})}catch(e){}
}
let NB=null,NB0=null,popStep=0;
// Light bubble pop for the tab bar: a soft sine sweeping quickly upward plus a tiny click.
function bubble(vol=.22,mult=1){
  if(!S.settings.sound)return;
  try{const a=ac(),t=a.currentTime+.003,out=a.destination,j=mult*(.98+Math.random()*.04);
    const o=a.createOscillator(),g=a.createGain();o.type="sine";
    o.frequency.setValueAtTime(380*j,t);o.frequency.exponentialRampToValueAtTime(1150*j,t+.035);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+.07);
    o.connect(g);g.connect(out);o.start(t);o.stop(t+.08);
    if(!NB0){NB0=a.createBuffer(1,a.sampleRate*.02|0,a.sampleRate);const d=NB0.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,6)}
    const n=a.createBufferSource(),f=a.createBiquadFilter(),ng=a.createGain();n.buffer=NB0;f.type="highpass";f.frequency.value=2500;
    ng.gain.setValueAtTime(vol*.35,t);ng.gain.exponentialRampToValueAtTime(.0001,t+.015);n.connect(f);f.connect(ng);ng.connect(out);n.start(t);n.stop(t+.02);
  }catch(e){}
}
// Each page change pops a step higher (pentatonic up to an octave), then resets after 6.
const POP_STEPS=[0,2,4,7,9,12];
function popNext(vol=.22){bubble(vol,Math.pow(2,POP_STEPS[popStep]/12));popStep=(popStep+1)%POP_STEPS.length}
// Wooden chess-piece clack, used only when ticking off a habit.
function chess(vol=.45){
  if(!S.settings.sound)return;
  try{const a=ac();
    if(!NB){NB=a.createBuffer(1,a.sampleRate*.08|0,a.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,4)}
    const t=a.currentTime+.004,out=a.destination;
    const n=a.createBufferSource();n.buffer=NB;n.playbackRate.value=.9+Math.random()*.2;
    const bp=a.createBiquadFilter();bp.type="bandpass";bp.frequency.value=1700+Math.random()*400;bp.Q.value=2.2;
    const g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);
    n.connect(bp);bp.connect(g);g.connect(out);n.start(t);n.stop(t+.08);
    const o=a.createOscillator(),og=a.createGain();o.type="sine";o.frequency.setValueAtTime(240,t);o.frequency.exponentialRampToValueAtTime(85,t+.06);
    og.gain.setValueAtTime(vol*.9,t);og.gain.exponentialRampToValueAtTime(.001,t+.08);o.connect(og);og.connect(out);o.start(t);o.stop(t+.1);
    const o2=a.createOscillator(),g2=a.createGain();o2.type="triangle";o2.frequency.value=640+Math.random()*60;
    g2.gain.setValueAtTime(vol*.22,t);g2.gain.exponentialRampToValueAtTime(.001,t+.045);o2.connect(g2);g2.connect(out);o2.start(t);o2.stop(t+.06);
  }catch(e){}
}

/* ================= perfect-day animation ================= */
// The day's ring fills segment by segment, turns to the accent colour, then
// collapses and streams into your gold and level ring.
function playPerfect(items,from,to,n){
  busy=true;scrollTo(0,0);n=Math.max(1,n||1);
  const vx=$("#vXP");vx._tok=null;vx.textContent=from;
  const R=108,gap=n>1?7:0,segs=[];
  for(let i=0;i<n;i++){
    const a0=(-90+i*360/n+gap/2)*Math.PI/180,a1=(-90+(i+1)*360/n-gap/2)*Math.PI/180;
    if(n===1)segs.push(`<circle class="seg" r="${R}" cx="0" cy="0" style="stroke:var(--s2)"/>`);
    else segs.push(`<path class="seg" d="M${R*Math.cos(a0)} ${R*Math.sin(a0)} A${R} ${R} 0 ${(a1-a0)>Math.PI?1:0} 1 ${R*Math.cos(a1)} ${R*Math.sin(a1)}" style="stroke:var(--s2)"/>`);
  }
  const ov=document.createElement("div");ov.id="pd";
  ov.innerHTML=`<div class="pr"><svg viewBox="-130 -130 260 260" id="pdsvg">${segs.join("")}</svg><div class="ctr"><b id="pdn">0/${n}</b><span>today</span></div></div>
    <div class="lbl" id="pdl">Perfect day</div><div class="lbl2" id="pdl2">+${XP_PERFECT} XP bonus</div><div class="skip">Tap to skip</div>`;
  document.body.appendChild(ov);const hud=$("#hud");hud.classList.add("lift");
  const els=[...ov.querySelectorAll(".seg")],num=ov.querySelector("#pdn"),svg=ov.querySelector("#pdsvg");
  let done=false;const T=[];const at=(ms,f)=>T.push(setTimeout(()=>{if(!done)f()},ms));
  const step=Math.min(260,1400/n);
  els.forEach((s,i)=>at(350+i*step,()=>{s.style.stroke="var(--c1)";num.textContent=`${i+1}/${n}`;bumpEl(num);SFX.seg(i);vib(10)}));
  const tFull=350+n*step+150;
  at(tFull,()=>{els.forEach(s=>s.style.stroke="var(--acc)");svg.animate([{transform:"scale(1)"},{transform:"scale(1.08)"},{transform:"scale(1)"}],{duration:500,easing:"ease-out"});
    num.innerHTML=I("check");num.style.color="var(--acc)";num.style.fontSize="46px";SFX.swell();vib([20,30,40]);
    ov.querySelector("#pdl").classList.add("on");ov.querySelector("#pdl2").classList.add("on");
    const r=svg.getBoundingClientRect();bigFx(r.left+r.width/2,r.top+r.height/2)});
  at(tFull+1100,()=>{
    svg.animate([{transform:"scale(1) rotate(0deg)",opacity:1},{transform:"scale(.15) rotate(220deg)",opacity:0}],{duration:520,easing:"cubic-bezier(.6,0,.4,1)",fill:"forwards"});
    ov.querySelector(".ctr").animate([{opacity:1},{opacity:0}],{duration:300,fill:"forwards"});
    const r=svg.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,N=16;let landed=0;
    setTimeout(()=>{for(let i=0;i<N;i++)flyDot(cx,cy,i%4===3?$("#lvp").closest(".lvr"):$("#pXP"),i,()=>{if(done)return;landed++;vx.textContent=Math.round(from+(to-from)*landed/N);bumpEl($("#pXP"));SFX.coin(landed);if(landed===N)at(400,finish)},i%4===3?cssv("--c1"):cssv("--c2"))},380);
  });
  at(tFull+4200,finish);
  function finish(){
    if(done)return;done=true;T.forEach(clearTimeout);vx.textContent=to;
    ov.classList.add("out");setTimeout(()=>{ov.remove();hud.classList.remove("lift")},320);
    busy=false;CQ.unshift(...items);celOpen=true;setTimeout(nextCel,260);
  }
  ov.addEventListener("pointerdown",finish);
}

  live();
}

  on("a_inst",()=>{try{localStorage.removeItem("habits.noinstall")}catch(e){}toast("Install prompt will show next time in the browser")});
  on("a_wipe",()=>{openSheet(`<h2>Erase all data?</h2><div class="note">Deletes every habit, all history, gold and unlocks on this device. Copy a backup first if you might want it back.</div><div class="acts"><button class="btn ghost" data-close>Keep</button><button class="btn danger" id="wgo">Erase</button></div>`);
    $("#wgo").onclick=()=>{S={v:4,updated:0,habits:[],log:{},settings:{sound:true},admin:{on:true,all:S.admin.all}};shown=null;closeSheet();commit();toast("All data erased")}});
  on("a_exit",()=>{S.admin={};commit();go("camp");toast("Admin mode off")});
}

/* ================= editor ================= */
function addHabit(o){S.habits.push({id:uid(),name:o.name,emoji:o.emoji||"🎯",color:o.color||COLORS[S.habits.length%COLORS.length],freq:o.freq||"days",target:o.target||3,days:o.days||[0,1,2,3,4,5,6],created:key(today())});commit()}
function editor(h){
  const st={name:h?h.name:"",emoji:h?h.emoji:"🎯",color:h?h.color:COLORS[S.habits.length%COLORS.length],freq:h?h.freq:"days",target:h?h.target:3,days:h?h.days.slice():[0,1,2,3,4,5,6]};
  const draw=()=>{
    const y=$("#sheet").scrollTop;
    openSheet(`<h2>${h?"Edit habit":"New habit"}</h2>
    <label class="f">Name</label><input type="text" id="hn" maxlength="40" placeholder="e.g. Gym session" value="${esc(st.name)}">
    <label class="f">Icon</label><div class="grid">${EMOJI.map(e=>`<button data-e="${e}" class="${e===st.emoji?"on":""}">${e}</button>`).join("")}</div>
    
    <label class="f">How often</label><div class="seg"><button data-f="days" class="${st.freq==="days"?"on":""}">Set days</button><button data-f="week" class="${st.freq==="week"?"on":""}">Times a week</button></div>
    ${st.freq==="days"?`<div class="dsel" style="margin-top:10px">${DN.map((d,i)=>`<button data-d="${i}" class="${st.days.includes(i)?"on":""}">${d}</button>`).join("")}</div>
      <div class="quick"><button data-q="all">Every day</button><button data-q="wk">Weekdays</button><button data-q="we">Weekends</button></div>`
    :`<div class="stepper"><button data-st="-1" ${st.target<=1?"disabled":""}>−</button><div><b>${st.target}</b><span>time${st.target===1?"":"s"} a week</span></div><button data-st="1" ${st.target>=6?"disabled":""}>+</button></div>
      <div class="note">Any days you like. Progress resets each Monday.</div>`}
    <div class="acts">${h?`<button class="btn ghost" id="del" style="flex:0 0 auto;width:auto;color:#ff6b6b">Delete</button>`:""}<button class="btn ghost" data-close>Cancel</button><button class="btn" id="save">Save</button></div>`);
    $("#sheet").scrollTop=y;
    const hn=$("#hn");hn.oninput=()=>st.name=hn.value;
    document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{st.emoji=b.dataset.e;draw()});
    document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{st.color=b.dataset.c;draw()});
    document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{st.freq=b.dataset.f;draw()});
    document.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{st.target=Math.min(6,Math.max(1,st.target+ +b.dataset.st));draw()});
    document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const i=+b.dataset.d;st.days=st.days.includes(i)?st.days.filter(x=>x!==i):[...st.days,i].sort();draw()});
    document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{st.days={all:[0,1,2,3,4,5,6],wk:[0,1,2,3,4],we:[5,6]}[b.dataset.q];draw()});
    $("#save").onclick=()=>{
      const n=st.name.trim();if(!n){toast("Give it a name");hn.focus();return}
      if(st.freq==="days"&&!st.days.length){toast("Pick at least one day");return}
      const o={name:n,emoji:st.emoji,color:st.color,freq:st.freq,target:st.target,days:st.days.length?st.days:[0,1,2,3,4,5,6]};
      if(h)Object.assign(h,o);else addHabit(o);closeSheet();if(h)commit();
    };
    const del=$("#del");if(del)del.onclick=()=>{
      openSheet(`<h2>Delete “${esc(h.name)}”?</h2><div class="note">Its history and the XP it earned will be removed. This can't be undone.</div><div class="acts"><button class="btn ghost" data-close>Keep</button><button class="btn danger" id="delgo">Delete</button></div>`);
      $("#delgo").onclick=()=>{S.habits=S.habits.filter(x=>x.id!==h.id);for(const k in S.log){delete S.log[k][h.id];if(!Object.keys(S.log[k]).length)delete S.log[k]}closeSheet();commit();toast("Deleted")};
    };
  };
  draw();
}
function openSheet(html){$("#sheet").innerHTML=html;$("#ov").classList.add("show");document.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet)}
function closeSheet(){$("#ov").classList.remove("show");const f=window._sheetClose;window._sheetClose=null;if(f)f()}
$("#ov").onclick=e=>{if(e.target.id==="ov")closeSheet()};




/* ---------- install prompt (for friends opening the link) ---------- */
const STANDALONE=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
let installEvt=null;addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;if(!$("#ov").classList.contains("show"))render()});
const skippedInstall=()=>{try{return localStorage.getItem("habits.noinstall")==="1"}catch(e){return false}};
function installSheet(){
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  openSheet(`<div style="font-size:44px;text-align:center">📲</div><h2 style="text-align:center">Install Habits</h2>
  <div class="note">Add it to your home screen so it opens full-screen like a normal app. <b style="color:var(--txt)">Do this before you start</b>: the browser and the home-screen app keep separate progress.</div>
  ${ios?`<ol class="steps"><li>Tap <b>Share</b> <span class="kbd">⬆</span> in Safari (on newer iPhones tap <b>⋯</b> first)</li><li>Tap <b>Add to Home Screen</b></li><li>Tap <b>Add</b>, then open <b>Habits</b> from your home screen</li></ol>`
       :`<ol class="steps"><li>Tap the <b>⋮</b> menu in Chrome</li><li>Tap <b>Install app</b> or <b>Add to Home screen</b></li><li>Open <b>Habits</b> from your home screen</li></ol>`}
  ${S.habits.length?`<div class="note">Already tracking in the browser? Copy a backup first, then use Habits → Restore in the installed app.</div>`:""}
  <div class="acts">${S.habits.length?`<button class="btn ghost" id="instbk">Copy backup</button>`:""}${installEvt?`<button class="btn" id="instgo">Install</button>`:`<button class="btn" data-close>Got it</button>`}</div>
  <button class="note" id="instskip" style="display:block;margin:16px auto 0;text-decoration:underline">Keep using it in the browser</button>`);
  const g=$("#instgo");if(g)g.onclick=async()=>{installEvt.prompt();try{await installEvt.userChoice}catch(e){}installEvt=null;closeSheet();render()};
  const bk=$("#instbk");if(bk)bk.onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(S));toast("Backup copied")}catch(e){toast("Use Habits → Copy backup instead")}};
  $("#instskip").onclick=()=>{try{localStorage.setItem("habits.noinstall","1")}catch(e){}closeSheet();render()};
}
if(!STANDALONE&&!skippedInstall())setTimeout(installSheet,700);



/* ================= liquid glass tab bar ================= */
const glass=$("#glass"),lens=$("#lens"),tabs=[...glass.querySelectorAll("button")];
const tabIdx=()=>{const i=tabs.findIndex(b=>b.dataset.v===view);return i<0?Math.max(0,tabs.findIndex(b=>b.dataset.v===prevView)):i};
const lensX=()=>parseFloat(lens.style.translate)||0;
function lensTo(i,anim=true){
  const b=tabs[i],x=b.offsetLeft;lens.style.width=b.offsetWidth+"px";
  if(!anim||!lens.style.translate){lens.style.transition="none";lens.style.translate=x+"px 0";void lens.offsetWidth;lens.style.transition="";return}
  if(Math.abs(lensX()-x)>2)lens.animate([{scale:"1 1"},{scale:"1.24 .84",offset:.3},{scale:".95 1.06",offset:.65},{scale:"1 1"}],{duration:560,easing:"ease-out"});
  lens.style.translate=x+"px 0";
}
function nearestTab(cx){let best=0,d=1e9;tabs.forEach((b,i)=>{const m=Math.abs(b.offsetLeft+b.offsetWidth/2-cx);if(m<d){d=m;best=i}});return best}
function go(v){if(v!==view){if(view!=="manage")prevView=view;view=v;if(v==="today")cur=today();render();scrollTo({top:0,behavior:"smooth"})}else lensTo(tabIdx())}
function goTab(v,quiet){vib(8);if(!quiet&&v!==view)popNext();go(v)}
let drag=null;
glass.addEventListener("pointerdown",e=>{drag={id:e.pointerId,x0:e.clientX,off:e.clientX-glass.getBoundingClientRect().left-lensX(),moved:false};const b=e.target.closest("button");if(b&&tabs.indexOf(b)!==tabIdx())drag.off=lens.offsetWidth/2});
glass.addEventListener("pointermove",e=>{
  if(!drag||e.pointerId!==drag.id)return;
  if(!drag.moved){if(Math.abs(e.clientX-drag.x0)<8)return;drag.moved=true;lens.classList.add("drag");try{glass.setPointerCapture(e.pointerId)}catch(_){}}
  const w=lens.offsetWidth,max=glass.clientWidth-w-6,x=Math.min(max,Math.max(6,e.clientX-glass.getBoundingClientRect().left-drag.off));
  lens.style.translate=x+"px 0";const i=nearestTab(x+w/2);if(i!==drag.hv){if(drag.hv!==undefined)popNext(.16);drag.hv=i}tabs.forEach((b,j)=>b.classList.toggle("hover",j===i));
});
function endDrag(e,cancel){
  if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;lens.classList.remove("drag");tabs.forEach(b=>b.classList.remove("hover"));
  if(cancel){lensTo(tabIdx());return}
  if(d.moved){goTab(tabs[nearestTab(lensX()+lens.offsetWidth/2)].dataset.v,true);lensTo(tabIdx())}
  else{const b=e.target.closest&&e.target.closest("button");if(b)goTab(b.dataset.v)}
}
glass.addEventListener("pointerup",e=>endDrag(e,false));glass.addEventListener("pointercancel",e=>endDrag(e,true));
addEventListener("resize",()=>lensTo(tabIdx(),false));
try{document.fonts&&document.fonts.ready.then(()=>lensTo(tabIdx(),false))}catch(e){}
let lastDay=key(today());
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&key(today())!==lastDay){lastDay=key(today());cur=today();render()}});
setInterval(()=>{if(view==="quests"&&!document.hidden&&!$("#ov").classList.contains("show"))rQuests()},60000);


/* ================= boot ================= */
loadLocal();render();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
initSocial();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});

</script>
